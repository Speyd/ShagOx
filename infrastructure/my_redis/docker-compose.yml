services:
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped

    environment:
      REDIS_DATA_PORT: ${REDIS_DATA_PORT}

    ports:
      - "${REDIS_DATA_PORT}:6379"

    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./certs:/certs:ro
      - ./acl/redis:/redis:ro
      - redis-data:/data

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

  user-redis:
    image: redis:7
    container_name: user-redis
    restart: unless-stopped

    environment:
      REDIS_USER_PORT: ${REDIS_USER_PORT}

    ports:
      - "${REDIS_USER_PORT}:6379"

    volumes:
      - ./user-redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./certs:/certs:ro
      - ./acl/user-redis:/redis:ro
      - user-redis-data:/data

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf


volumes:
  redis-data:
  user-redis-data: