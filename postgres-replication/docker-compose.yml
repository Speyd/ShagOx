services:
  postgres-primary:
    image: postgres:17
    container_name: postgres-primary
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      REPLICATOR_USER: ${REPLICATOR_USER}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}

    ports:
      - "${POSTGRES_PRIMARY_PORT}:5432"

    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary/init:/docker-entrypoint-initdb.d:ro
      - ./primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=3
      - -c
      - wal_keep_size=512MB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - postgres-network

  postgres-replica-1:
    image: postgres:17
    container_name: postgres-replica-1
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_REPLICA_1_PORT}:5432"

    volumes:
      - replica_1_data:/var/lib/postgresql/data

    depends_on:
      postgres-primary:
        condition: service_healthy

    networks:
      - postgres-network

  postgres-replica-2:
    image: postgres:17
    container_name: postgres-replica-2
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_REPLICA_2_PORT}:5432"

    volumes:
      - replica_2_data:/var/lib/postgresql/data

    depends_on:
      postgres-primary:
        condition: service_healthy

    networks:
      - postgres-network

  postgres-replica-3:
    image: postgres:17
    container_name: postgres-replica-3
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_REPLICA_3_PORT}:5432"

    volumes:
      - replica_3_data:/var/lib/postgresql/data

    depends_on:
      postgres-primary:
        condition: service_healthy

    networks:
      - postgres-network

volumes:
  primary_data:
  replica_1_data:
  replica_2_data:
  replica_3_data:

networks:
  postgres-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
