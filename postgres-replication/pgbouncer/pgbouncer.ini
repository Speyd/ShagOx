[databases]
mydb_write  = host=postgres-primary   port=5432 dbname=shagox user=pgBouncer password=U/%QyNj9hahk+9U
mydb_read_1 = host=postgres-replica-1 port=5432 dbname=shagox user=pgBouncer password=U/%QyNj9hahk+9U
mydb_read_2 = host=postgres-replica-2 port=5432 dbname=shagox user=pgBouncer password=U/%QyNj9hahk+9U
mydb_read_3 = host=postgres-replica-3 port=5432 dbname=shagox user=pgBouncer password=U/%QyNj9hahk+9U

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = session

max_client_conn = 500

default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5

server_connect_timeout = 5
server_idle_timeout = 600
client_idle_timeout = 0

log_connections = 1
log_disconnections = 1